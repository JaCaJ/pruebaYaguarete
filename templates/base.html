{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}Gestión de empresas{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/tabler.min.css' %}">
  </head>
  <body>
    <div class="page">
      <header class="navbar navbar-expand-md d-print-none">
        <div class="container-xl">
          <h1 class="navbar-brand navbar-brand-autodark pe-0 pe-md-3 mb-0">
            <a href="{% url 'empresa-list' %}">Gestión de empresas</a>
          </h1>
          <div class="navbar-nav flex-row order-md-last">
            <div class="nav-item d-flex align-items-center me-3">
              <span class="text-secondary">{{ user.get_username }}</span>
            </div>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-secondary">Salir</button>
            </form>
          </div>
        </div>
      </header>
      <div class="page-wrapper">
        <div class="page-body">
          <div class="container-xl">
            {% block content %}{% endblock %}
          </div>
        </div>
      </div>
    </div>
    <script src="{% static 'js/tabler.min.js' %}"></script>
  </body>
</html>
